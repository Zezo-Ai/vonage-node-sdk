  notify-release:
    runs-on: ubuntu-latest
    name: Notify Release

    steps:
      - name: Post a message in a channel
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: ":initial_external_notification_sent: Version ${{ github.event.name }} of the NodeJS SDK has been released"
              - type: "section"
                text:
                  type: "plain_text"
                  text: "${{ github.event.body }}"
                  emoji: true
              - type: "divider"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "You can view the full change log <${{github.event.html_url }}|here>"

